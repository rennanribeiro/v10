<media-seek-button
  class="grid size-media-control shrink-0 place-items-center rounded-media-pill border-0 bg-transparent p-0 text-inherit cursor-pointer outline-2 outline-transparent -outline-offset-2 hover:bg-media-control-hover focus-visible:bg-media-control-hover aria-expanded:bg-media-control-hover focus-visible:outline-current focus-visible:outline-offset-2 aria-disabled:cursor-not-allowed aria-disabled:opacity-50"
  seconds="10"
>
  <media-icon class="size-media-icon drop-shadow-media-icon" name="seek"></media-icon>
  <span class="tabular-nums">10</span>
</media-seek-button>
<media-tooltip
  class="bg-media-surface text-media-controls shadow-media-surface backdrop-blur-media-surface m-0 whitespace-nowrap rounded-media-pill border-0 px-2.5 py-[0.35rem] data-open:flex data-open:items-center data-open:gap-1"
>
  <media-tooltip-label></media-tooltip-label>
  <media-tooltip-shortcut class="text-[0.75em] font-semibold"></media-tooltip-shortcut>
</media-tooltip>
