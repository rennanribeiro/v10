<media-fullscreen-button
  class="grid size-media-control shrink-0 place-items-center rounded-media-pill border-0 bg-transparent p-0 text-inherit cursor-pointer outline-2 outline-transparent -outline-offset-2 hover:bg-media-control-hover focus-visible:bg-media-control-hover aria-expanded:bg-media-control-hover focus-visible:outline-current focus-visible:outline-offset-2 aria-disabled:cursor-not-allowed aria-disabled:opacity-50 group/fullscreen"
>
  <media-icon
    class="size-media-icon drop-shadow-media-icon hidden opacity-0 group-not-data-fullscreen/fullscreen:block group-not-data-fullscreen/fullscreen:opacity-100"
    name="fullscreen-enter"
  ></media-icon>
  <media-icon
    class="size-media-icon drop-shadow-media-icon hidden opacity-0 group-data-fullscreen/fullscreen:block group-data-fullscreen/fullscreen:opacity-100"
    name="fullscreen-exit"
  ></media-icon>
</media-fullscreen-button>
<media-tooltip
  class="bg-media-surface text-media-controls shadow-media-surface backdrop-blur-media-surface m-0 whitespace-nowrap rounded-media-pill border-0 px-2.5 py-[0.35rem] data-open:flex data-open:items-center data-open:gap-1"
>
  <media-tooltip-label></media-tooltip-label>
  <media-tooltip-shortcut class="text-[0.75em] font-semibold"></media-tooltip-shortcut>
</media-tooltip>
