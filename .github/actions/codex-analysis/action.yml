name: Cached Codex analysis
description: Run Codex against staged inputs and publish a structured handoff artifact.

inputs:
  task:
    description: Stable task name used to namespace cached results.
    required: true
  input-path:
    description: Directory containing the staged, untrusted inputs.
    required: true
  prompt-file:
    description: Trusted prompt file checked into the repository.
    required: true
  schema-file:
    description: JSON schema for the final Codex response.
    required: true
  model:
    description: Codex model.
    required: true
  effort:
    description: Codex reasoning effort.
    required: true
  permission-profile:
    description: Built-in Codex permission profile.
    required: false
    default: ':read-only'
  capture-patch:
    description: Capture repository edits as a binary patch.
    required: false
    default: 'false'
  openai-api-key:
    description: OpenAI API key passed to codex-action.
    required: true
  allow-users:
    description: Users permitted to trigger Codex.
    required: false
    default: ''
  allow-bots:
    description: Whether github-actions bot may trigger Codex.
    required: false
    default: 'false'

outputs:
  cache_hit:
    description: Whether an exact cached result was restored.
    value: ${{ steps.cache.outputs.hit }}
  cache_artifact:
    description: Content-addressed artifact name used for the validated cache.
    value: ${{ steps.fingerprint.outputs.cache_artifact }}
  fingerprint:
    description: SHA-256 fingerprint of all semantic inputs.
    value: ${{ steps.fingerprint.outputs.fingerprint }}
  result_artifact:
    description: Current-run handoff artifact containing the result and optional patch.
    value: ${{ steps.names.outputs.result_artifact }}

runs:
  using: composite
  steps:
    - name: Fingerprint semantic inputs
      id: fingerprint
      shell: bash
      env:
        CODEX_EFFORT: ${{ inputs.effort }}
        CODEX_INPUT_PATH: ${{ inputs.input-path }}
        CODEX_MODEL: ${{ inputs.model }}
        CODEX_PERMISSION_PROFILE: ${{ inputs.permission-profile }}
        CODEX_PROMPT_FILE: ${{ inputs.prompt-file }}
        CODEX_SCHEMA_FILE: ${{ inputs.schema-file }}
        CODEX_TASK: ${{ inputs.task }}
      run: |
        set -euo pipefail

        input_hash="$({ find "$CODEX_INPUT_PATH" -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)"
        repository_sha="$(git rev-parse HEAD)"
        fingerprint="$(
          printf '%s\0' \
            'codex-analysis-v1' \
            "$CODEX_TASK" \
            "$CODEX_MODEL" \
            "$CODEX_EFFORT" \
            "$CODEX_PERMISSION_PROFILE" \
            "$repository_sha" \
            "$input_hash" \
            "$(sha256sum "$CODEX_PROMPT_FILE" | cut -d' ' -f1)" \
            "$(sha256sum "$CODEX_SCHEMA_FILE" | cut -d' ' -f1)" \
            | sha256sum \
            | cut -d' ' -f1
        )"

        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        echo "cache_artifact=codex-cache-$CODEX_TASK-$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore exact validated result
      id: cache
      shell: bash
      env:
        CACHE_ARTIFACT: ${{ steps.fingerprint.outputs.cache_artifact }}
        CODEX_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node .github/scripts/codex-workflow.mjs restore-cache /tmp/codex-result

    - name: Run Codex
      if: steps.cache.outputs.hit != 'true'
      uses: openai/codex-action@v1
      with:
        allow-bots: ${{ inputs.allow-bots }}
        allow-users: ${{ inputs.allow-users }}
        effort: ${{ inputs.effort }}
        model: ${{ inputs.model }}
        openai-api-key: ${{ inputs.openai-api-key }}
        output-file: /tmp/codex-result/output.json
        output-schema-file: ${{ inputs.schema-file }}
        permission-profile: ${{ inputs.permission-profile }}
        prompt-file: ${{ inputs.prompt-file }}
        safety-strategy: drop-sudo

    - name: Capture Codex handoff
      if: steps.cache.outputs.hit != 'true'
      shell: bash
      env:
        CAPTURE_PATCH: ${{ inputs.capture-patch }}
        CODEX_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        CODEX_TASK: ${{ inputs.task }}
      run: |
        set -euo pipefail

        jq -e . /tmp/codex-result/output.json >/dev/null

        if [ "$CAPTURE_PATCH" = 'true' ]; then
          git add -A -- .
          git diff --cached --binary -- . > /tmp/codex-result/changes.patch
        fi

        jq -n \
          --arg fingerprint "$CODEX_FINGERPRINT" \
          --arg task "$CODEX_TASK" \
          '{version: 1, task: $task, fingerprint: $fingerprint}' \
          > /tmp/codex-result/manifest.json

    - name: Name handoff artifact
      id: names
      shell: bash
      env:
        CODEX_TASK: ${{ inputs.task }}
      run: echo "result_artifact=codex-result-$CODEX_TASK-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Upload current-run handoff
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.names.outputs.result_artifact }}
        path: /tmp/codex-result/
        if-no-files-found: error
        retention-days: 14
