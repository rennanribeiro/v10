name: Issue Sync

on:
  pull_request:
    types: [closed]

concurrency:
  group: issue-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Stage pull request and issue evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs prepare issue-sync /tmp/codex-input

      - name: Upload staged inputs
        uses: actions/upload-artifact@v4
        with:
          name: codex-input-issue-sync-${{ github.run_attempt }}
          path: /tmp/codex-input/
          if-no-files-found: error
          retention-days: 14

  analyze:
    needs: prepare
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_codex-analyze.yml
    with:
      effort: medium
      input_artifact: codex-input-issue-sync-${{ github.run_attempt }}
      model: gpt-5.6-terra
      prompt_file: .github/codex/prompts/issue-sync.md
      schema_file: .github/codex/schemas/issue-sync.json
      task: issue-sync
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  apply:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-issue-sync-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Apply validated issue updates
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs apply issue-sync /tmp/codex-input /tmp/codex-result
