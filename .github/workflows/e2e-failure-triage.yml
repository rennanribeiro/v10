name: E2E Failure Triage

on:
  workflow_run:
    workflows: ['E2E Tests']
    types: [completed]

concurrency:
  group: e2e-failure-triage-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  prepare_pr:
    name: Stage PR failure evidence
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Stage failed run evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs prepare e2e-pr /tmp/codex-input

      - name: Upload staged inputs
        uses: actions/upload-artifact@v4
        with:
          name: codex-input-e2e-pr-${{ github.run_attempt }}
          path: /tmp/codex-input/
          if-no-files-found: error
          retention-days: 14

  analyze_pr:
    needs: prepare_pr
    if: needs.prepare_pr.result == 'success'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_codex-analyze.yml
    with:
      allow_users: '*'
      effort: medium
      input_artifact: codex-input-e2e-pr-${{ github.run_attempt }}
      model: gpt-5.6-terra
      prompt_file: .github/codex/prompts/e2e-pr.md
      schema_file: .github/codex/schemas/e2e-diagnostic.json
      task: e2e-pr
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  apply_pr:
    needs: analyze_pr
    if: needs.analyze_pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-e2e-pr-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze_pr.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Apply validated diagnostic
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze_pr.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs apply e2e-pr /tmp/codex-input /tmp/codex-result

  prepare_main:
    name: Stage main failure evidence
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Stage failed run evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs prepare e2e-main /tmp/codex-input

      - name: Upload staged inputs
        uses: actions/upload-artifact@v4
        with:
          name: codex-input-e2e-main-${{ github.run_attempt }}
          path: /tmp/codex-input/
          if-no-files-found: error
          retention-days: 14

  analyze_main:
    needs: prepare_main
    if: needs.prepare_main.result == 'success'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_codex-analyze.yml
    with:
      allow_users: '*'
      capture_patch: true
      checkout_ref: ${{ github.event.workflow_run.head_sha }}
      effort: high
      fetch_depth: 0
      input_artifact: codex-input-e2e-main-${{ github.run_attempt }}
      install_dependencies: true
      model: gpt-5.6-sol
      permission_profile: ':workspace'
      prompt_file: .github/codex/prompts/e2e-main.md
      schema_file: .github/codex/schemas/e2e-diagnostic.json
      task: e2e-main
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  verify_main:
    needs: analyze_main
    if: needs.analyze_main.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout failed revision without credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: '.nvmrc'

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-e2e-main-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze_main.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Verify corrective patch shape
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze_main.outputs.fingerprint }}
        run: node .github/scripts/codex-workflow.mjs verify e2e-main /tmp/codex-input /tmp/codex-result

      - name: Verify corrective patch
        run: |
          if jq -e '.classification == "expected change" and .confidence == "high"' /tmp/codex-result/output.json >/dev/null; then
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm lint
          fi

  publish_main:
    needs: [analyze_main, verify_main]
    if: needs.analyze_main.result == 'success' && needs.verify_main.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout failed revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-e2e-main-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze_main.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Publish validated diagnostic
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze_main.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs apply e2e-main /tmp/codex-input /tmp/codex-result
