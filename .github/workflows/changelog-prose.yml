name: Changelog Prose

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. @videojs/core@10.0.0-beta.24)'
        required: true
        type: string
      release_url:
        description: 'Release URL (defaults to the tag release page)'
        required: false
        type: string

concurrency:
  group: changelog-prose-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, '@videojs/core@')
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Relay release to workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run changelog-prose.yml \
            --repo "$GITHUB_REPOSITORY" \
            --raw-field tag_name="$TAG_NAME" \
            --raw-field release_url="$RELEASE_URL"

  prepare:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.tag_name, '@videojs/core@')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      release-url: ${{ steps.version.outputs.release_url }}
      skip: ${{ steps.guard.outputs.skip }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse version
        id: version
        env:
          RELEASE_URL: ${{ inputs.release_url }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#@videojs/core@}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ -n "$RELEASE_URL" ]; then
            echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          else
            encoded_tag="$(jq -rn --arg tag "$TAG_NAME" '$tag | @uri')"
            echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${encoded_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check raw changelog exists
        id: guard
        run: |
          file="site/src/content/changelog/${{ steps.version.outputs.version }}.mdx"
          if [ ! -f "$file" ]; then
            echo "::warning::Raw changelog file $file not found on main; skipping prose generation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release and pull request evidence
        if: steps.guard.outputs.skip != 'true'
        env:
          CHANGELOG_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.version.outputs.release_url }}
        run: node .github/scripts/codex-workflow.mjs prepare changelog /tmp/codex-input

      - name: Upload staged inputs
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-input-changelog-${{ github.run_attempt }}
          path: /tmp/codex-input/
          if-no-files-found: error
          retention-days: 14

  analyze:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_codex-analyze.yml
    with:
      allow_bots: true
      capture_patch: true
      effort: high
      fetch_depth: 0
      input_artifact: codex-input-changelog-${{ github.run_attempt }}
      model: gpt-5.6-terra
      permission_profile: ':workspace'
      prompt_file: .github/codex/prompts/changelog.md
      schema_file: .github/codex/schemas/changelog.json
      task: changelog
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  verify:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout trusted code without credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-changelog-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Verify changelog patch
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze.outputs.fingerprint }}
        run: node .github/scripts/codex-workflow.mjs verify changelog /tmp/codex-input /tmp/codex-result

  publish:
    needs: [prepare, analyze, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-changelog-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Publish validated changelog
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs apply changelog /tmp/codex-input /tmp/codex-result

      - name: Save validated result cache
        if: needs.analyze.outputs.cache_hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.cache_artifact }}
          path: /tmp/codex-result/
          if-no-files-found: error
          retention-days: 14
