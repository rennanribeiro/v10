name: Shared Codex Analysis

on:
  workflow_call:
    inputs:
      allow_bots:
        required: false
        type: boolean
        default: false
      allow_users:
        required: false
        type: string
        default: ''
      capture_patch:
        required: false
        type: boolean
        default: false
      checkout_ref:
        required: false
        type: string
        default: ''
      effort:
        required: true
        type: string
      fetch_depth:
        required: false
        type: number
        default: 1
      input_artifact:
        required: true
        type: string
      install_dependencies:
        required: false
        type: boolean
        default: false
      model:
        required: true
        type: string
      permission_profile:
        required: false
        type: string
        default: ':read-only'
      prompt_file:
        required: true
        type: string
      schema_file:
        required: true
        type: string
      task:
        required: true
        type: string
    secrets:
      openai_api_key:
        required: true
    outputs:
      fingerprint:
        value: ${{ jobs.analyze.outputs.fingerprint }}
      result_artifact:
        value: ${{ jobs.analyze.outputs.result_artifact }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      result_artifact: ${{ steps.names.outputs.result_artifact }}

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.input_artifact }}
          path: /tmp/codex-input

      - if: inputs.install_dependencies
        uses: pnpm/action-setup@v4

      - if: inputs.install_dependencies
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: '.nvmrc'

      - name: Install dependencies before removing network access
        if: inputs.install_dependencies
        run: pnpm install --frozen-lockfile

      - name: Fingerprint semantic inputs
        id: fingerprint
        env:
          CODEX_EFFORT: ${{ inputs.effort }}
          CODEX_INPUT_PATH: /tmp/codex-input
          CODEX_MODEL: ${{ inputs.model }}
          CODEX_PERMISSION_PROFILE: ${{ inputs.permission_profile }}
          CODEX_PROMPT_FILE: ${{ inputs.prompt_file }}
          CODEX_SCHEMA_FILE: ${{ inputs.schema_file }}
          CODEX_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail

          input_hash="$({ find "$CODEX_INPUT_PATH" -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)"
          repository_sha="$(git rev-parse HEAD)"
          fingerprint="$(
            printf '%s\0' \
              "$CODEX_TASK" \
              "$CODEX_MODEL" \
              "$CODEX_EFFORT" \
              "$CODEX_PERMISSION_PROFILE" \
              "$repository_sha" \
              "$input_hash" \
              "$(sha256sum "$CODEX_PROMPT_FILE" | cut -d' ' -f1)" \
              "$(sha256sum "$CODEX_SCHEMA_FILE" | cut -d' ' -f1)" \
              | sha256sum \
              | cut -d' ' -f1
          )"

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/codex-result

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          allow-bots: ${{ inputs.allow_bots }}
          allow-users: ${{ inputs.allow_users }}
          effort: ${{ inputs.effort }}
          model: ${{ inputs.model }}
          openai-api-key: ${{ secrets.openai_api_key }}
          output-file: /tmp/codex-result/output.json
          output-schema-file: ${{ inputs.schema_file }}
          permission-profile: ${{ inputs.permission_profile }}
          prompt-file: ${{ inputs.prompt_file }}
          safety-strategy: drop-sudo

      - name: Capture Codex handoff
        env:
          CAPTURE_PATCH: ${{ inputs.capture_patch }}
          CODEX_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          CODEX_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail

          jq -e . /tmp/codex-result/output.json >/dev/null

          if [ "$CAPTURE_PATCH" = 'true' ]; then
            git add -A -- .
            git diff --cached --binary -- . > /tmp/codex-result/changes.patch
          fi

          jq -n \
            --arg fingerprint "$CODEX_FINGERPRINT" \
            --arg task "$CODEX_TASK" \
            '{version: 1, task: $task, fingerprint: $fingerprint}' \
            > /tmp/codex-result/manifest.json

      - name: Name handoff artifact
        id: names
        env:
          CODEX_TASK: ${{ inputs.task }}
        run: echo "result_artifact=codex-result-$CODEX_TASK-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload current-run handoff
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.result_artifact }}
          path: /tmp/codex-result/
          if-no-files-found: error
          retention-days: 14
