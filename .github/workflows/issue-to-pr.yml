name: Issue To PR

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.issue.pull_request == null && github.event.label.name == 'agent:pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage issue and pull request evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs prepare issue-to-pr /tmp/codex-input

      - name: Upload staged inputs
        uses: actions/upload-artifact@v4
        with:
          name: codex-input-issue-to-pr-${{ github.run_attempt }}
          path: /tmp/codex-input/
          if-no-files-found: error
          retention-days: 14

  analyze:
    needs: prepare
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_codex-analyze.yml
    with:
      capture_patch: true
      effort: high
      fetch_depth: 0
      input_artifact: codex-input-issue-to-pr-${{ github.run_attempt }}
      install_dependencies: true
      model: gpt-5.6-sol
      permission_profile: ':workspace'
      prompt_file: .github/codex/prompts/issue-to-pr.md
      schema_file: .github/codex/schemas/issue-to-pr.json
      task: issue-to-pr
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  verify:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout trusted code without credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: '.nvmrc'

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-issue-to-pr-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Verify patch shape
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze.outputs.fingerprint }}
        run: node .github/scripts/codex-workflow.mjs verify issue-to-pr /tmp/codex-input /tmp/codex-result

      - name: Verify generated change
        run: |
          if jq -e '.status == "implemented"' /tmp/codex-result/output.json >/dev/null; then
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm lint
          fi

  publish:
    needs: [analyze, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download staged inputs
        uses: actions/download-artifact@v4
        with:
          name: codex-input-issue-to-pr-${{ github.run_attempt }}
          path: /tmp/codex-input

      - name: Download Codex result
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.result_artifact }}
          path: /tmp/codex-result

      - name: Publish validated result
        env:
          CODEX_FINGERPRINT: ${{ needs.analyze.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-workflow.mjs apply issue-to-pr /tmp/codex-input /tmp/codex-result

      - name: Save validated result cache
        if: needs.analyze.outputs.cache_hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.analyze.outputs.cache_artifact }}
          path: /tmp/codex-result/
          if-no-files-found: error
          retention-days: 14
